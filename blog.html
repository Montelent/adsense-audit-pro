<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog – AdSense Audit Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif} .prose h2{font-size:1.25rem;font-weight:700;margin-top:1.5rem;margin-bottom:0.5rem} .prose p{margin-bottom:1rem;line-height:1.7} .prose ul{list-style:disc;padding-left:1.25rem;margin-bottom:1rem}</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold text-lg">A</div>
        <span class="font-bold text-xl tracking-tight">AdSense<span class="text-brand-600">Audit</span> Pro</span>
      </a>
      <nav class="flex items-center gap-4 text-sm font-medium text-gray-600">
        <a href="index.html" class="hover:text-brand-600">Home</a>
        <a href="blog.html" class="text-brand-600">Blog</a>
        <a href="admin.html" class="text-xs px-2 py-1 rounded bg-gray-100 hover:bg-gray-200">Admin</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12">
    <div id="blogListView">
      <h1 class="text-3xl font-bold mb-2">Blog</h1>
      <p class="text-gray-600 mb-10">Guides and tips for AdSense readiness and publishing.</p>
      <div id="blogList" class="space-y-6"></div>
    </div>

    <div id="blogPostView" class="hidden">
      <a href="blog.html" class="text-sm text-brand-600 hover:underline mb-6 inline-block">← Back to all posts</a>
      <article>
        <div class="text-sm text-gray-500 mb-2" id="postMeta"></div>
        <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-6" id="postTitle"></h1>
        <div class="prose prose-gray max-w-none text-gray-700" id="postContent"></div>
      </article>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-10 mt-16">
    <div class="max-w-3xl mx-auto px-4 text-center text-sm">
      <a href="index.html" class="text-white font-medium">AdSense Audit Pro</a>
      <p class="mt-2 text-xs">Independent tool. Not affiliated with Google.</p>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('post');

    function renderList() {
      const blogs = (typeof getBlogs === 'function' ? getBlogs() : []).filter(b => b.published).sort((a,b) => (b.date || '').localeCompare(a.date || ''));
      const el = document.getElementById('blogList');
      if (!blogs.length) {
        el.innerHTML = '<p class="text-gray-500">No published posts yet. Create some in the <a href="admin.html" class="text-brand-600 underline">Admin panel</a>.</p>';
        return;
      }
      el.innerHTML = blogs.map(b => `
        <a href="blog.html?post=${encodeURIComponent(b.slug)}" class="block bg-white rounded-xl border border-gray-100 p-6 hover:border-brand-200 hover:shadow-md transition">
          <div class="text-xs text-gray-400 mb-2">${b.date || ''} · ${b.author || 'Admin'}</div>
          <h2 class="font-bold text-xl text-gray-900 mb-2">${b.title}</h2>
          <p class="text-gray-600 text-sm">${b.excerpt || ''}</p>
        </a>
      `).join('');
    }

    function renderPost(slug) {
      const blogs = typeof getBlogs === 'function' ? getBlogs() : [];
      const post = blogs.find(b => b.slug === slug && b.published);
      if (!post) {
        document.getElementById('blogListView').classList.remove('hidden');
        document.getElementById('blogPostView').classList.add('hidden');
        renderList();
        return;
      }
      document.getElementById('blogListView').classList.add('hidden');
      document.getElementById('blogPostView').classList.remove('hidden');
      document.getElementById('postMeta').textContent = `${post.date || ''} · ${post.author || 'Admin'}`;
      document.getElementById('postTitle').textContent = post.title;
      document.getElementById('postContent').innerHTML = post.content || '';
      document.title = post.title + ' – AdSense Audit Pro';
    }

    if (slug) renderPost(slug);
    else {
      document.getElementById('blogListView').classList.remove('hidden');
      document.getElementById('blogPostView').classList.add('hidden');
      renderList();
    }
  </script>
</body>
</html>
